<!DOCTYPE html>
<html>
<head>
    <title>Previous Year Papers</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background:url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f") no-repeat center center/cover;
            min-height:100vh;
            margin:0;
        }

        body::before{
            content:"";
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.35);
            z-index:-1;
        }

        .container{
            width:95%;
            max-width:650px;
            margin:120px auto;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
        }

        select,button{
            width:100%;
            padding:14px;
            font-size:17px;
            border-radius:8px;
            margin-bottom:18px;
        }

        button{
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        .papers a{
            display:block;
            margin-top:10px;
            padding:10px;
            background:#eee;
            text-decoration:none;
            color:black;
            border-radius:5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 Previous Year Papers</h2>

    <select id="department">
        <option value="">Select Department</option>
        <option value="english">English</option>
        <option value="history">History</option>
        <option value="physics">Physics</option>
        <option value="btech">Bachelor in Technology</option>
    </select>

    <select id="semester">
        <option value="">Select Semester</option>
        <option value="sem1">Semester 1</option>
        <option value="sem2">Semester 2</option>
        <option value="sem3">Semester 3</option>
        <option value="sem4">Semester 4</option>
        <option value="sem5">Semester 5</option>
        <option value="sem6">Semester 6</option>
        <option value="sem7">Semester 7</option>
        <option value="sem8">Semester 8</option>
    </select>

    <select id="year">
        <option value="">Select Year</option>
        <option>2026</option>
        <option>2025</option>
        <option>2024</option>
        <option>2023</option>
        <option>2022</option>
        <option>2021</option>
    </select>

    <button onclick="searchPapers()">Search</button>

    <div class="papers" id="results"></div>
</div>

<script>
function searchPapers() {

    const dept = document.getElementById("department").value;
    const sem = document.getElementById("semester").value;
    const year = document.getElementById("year").value;
    const results = document.getElementById("results");

    results.innerHTML = "";

    if (!dept || !sem || !year) {
        results.innerHTML =
            "<p>Please select department, semester and year.</p>";
        return;
    }

    fetch("papers.json")
    .then(response => response.json())
    .then(data => {

        const match = data.entries.find(item =>
            item.dept === dept &&
            item.sem === sem &&
            item.year === year
        );

        if (!match) {
            results.innerHTML =
                "<p style='color:red'>No papers found.</p>";
            return;
        }

        match.files.forEach(file => {

            results.innerHTML += `
                <a href="papers/${file}" target="_blank">
                    📄 ${file}
                </a>
            `;

        });

    })
    .catch(error => {

        console.error(error);

        results.innerHTML =
            "<p style='color:red'>Error loading papers.</p>";

    });

}
</script>
