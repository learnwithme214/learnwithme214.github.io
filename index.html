<!DOCTYPE html>
<html>
<head>
    <title>Previous Year Papers</title>
    <style>
        body { font-family: Arial; text-align: center; background: url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f") no-repeat center center/cover; min-height: 100vh; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); z-index: -1; }
        .container { width: 95%; max-width: 650px; min-height: 250px; margin: auto; margin-top: 120px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        select, button, input { width: 100%; padding: 14px; font-size: 17px; border-radius: 8px; margin-bottom: 18px; }
        button { background: green; color: white; border: none; cursor: pointer; margin-top: 10px; }
        .papers a, .paper-link { display: block; margin-top: 10px; padding: 10px; background: #eee; text-decoration: none; color: black; border-radius: 5px; }
        .download { font-size: 12px; color: blue; }
        .entrance-btn { position: fixed; top: 20px; left: 20px; background: #007bff; color: white; padding: 12px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        #entrancePage { display:none; }
    </style>
</head>
<body>

<a href="#" id="entranceBtn" class="entrance-btn" onclick="showEntrancePage()">🎓 Entrance Exam Papers</a>

<div class="container" id="mainPage">
    <h2>📚 Previous Year Papers</h2>
    <select id="department" onchange="handleDept()">
        <option value="">Select Department</option>
        <option value="english">English</option>
        <option value="history">History</option>
        <option value="physics">Physics</option>
        <option value="btech">Bachelor in technology</option>
    </select>
    <select id="semester" style="display:none;">
        <option value="">Select Semester</option>
        <option value="sem1">Sem 1</option>
        <option value="sem2">Sem 2</option>
        <option value="sem3">Sem 3</option>
        <option value="sem4">Sem 4</option>
        <option value="sem5">Sem 5</option>
        <option value="sem6">Sem 6</option>
    </select>
    <select id="year">
        <option value="">Select Year</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
    </select>
    <button onclick="searchPapers()">Search</button>
    <div class="papers" id="results"></div>
</div>

<div class="container" id="entrancePage">
    <h2>🎓 Entrance Exam Papers</h2>
    <input type="text" id="entranceSearch" placeholder="SEARCH ENTRANCE PAPERS" onkeyup="searchEntrancePapers()">
    <div id="entranceResults"></div>
    <button onclick="hideEntrancePage()">⬅ Back</button>
</div>

<script>
function handleDept() {
    const dept = document.getElementById("department").value;
    document.getElementById("semester").style.display = (dept === "btech") ? "block" : "none";
}

function searchPapers() {
    const dept = document.getElementById("department").value;
    const sem = document.getElementById("semester").value;
    const year = document.getElementById("year").value;
    const results = document.getElementById("results");
    results.innerHTML = "";

    if (!dept || !year || (dept === "btech" && !sem)) {
        results.innerHTML = "<p>Please select all fields</p>";
        return;
    }

    // Using absolute paths starting with /
    fetch("/papers/index.json")
        .then(res => res.json())
        .then(data => {
            let filtered = data.filter(item => {
                return item.dept.toLowerCase() === dept &&
                       (dept !== "btech" || item.sem.toLowerCase() === sem) &&
                       item.year === year;
            });

            if (filtered.length === 0) {
                results.innerHTML = "<p style='color:red;'>No files found</p>";
                return;
            }

            filtered.forEach(file => {
                let link = document.createElement("a");
                link.href = "/papers/" + file.file;
                link.target = "_blank";
                link.textContent = "📄 " + file.file;
                results.appendChild(link);
            });
        })
        .catch(err => {
            results.innerHTML = "<p style='color:red;'>Error loading index.json</p>";
        });
}

function showEntrancePage(){
    document.getElementById("mainPage").style.display = "none";
    document.getElementById("entrancePage").style.display = "block";
    document.getElementById("entranceBtn").style.display = "none";

    // Using absolute path
    fetch("/papers/entrance.json")
        .then(res => res.json())
        .then(data => {
            displayEntrancePapers(data.slice(0,5));
        });
}

function hideEntrancePage(){
    document.getElementById("entrancePage").style.display = "none";
    document.getElementById("mainPage").style.display = "block";
    document.getElementById("entranceBtn").style.display = "block";
}

function displayEntrancePapers(files){
    const results = document.getElementById("entranceResults");
    results.innerHTML = "";
    files.forEach(file => {
        let link = document.createElement("a");
        link.href = "/papers/" + file.file;
        link.target = "_blank";
        link.className = "paper-link";
        link.textContent = "📄 " + file.name;
        results.appendChild(link);
    });
}
</script>
</body>
</html>
